<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0b0f1a" />
    <title>Braise</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f1a; color: #c9d1dc; font: 14px/1.4 monospace; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center; }
      #boot pre { max-width: 90vw; white-space: pre-wrap; color: #ff3d81; margin: 0; }
    </style>
  </head>
  <body>
    <div id="boot">Chargement de Braise…</div>
    <div id="stage">
      <div id="game"></div>
      <div id="ui"></div>
    </div>
    <p id="small-hint" hidden>Fenêtre petite : passe en plein écran pour une image nette.</p>
    <script>
      // Si le jeu ne démarre pas, la page le dit au lieu de rester vide.
      (function () {
        var boot = document.getElementById('boot');
        function fail(text) {
          if (!boot) return;
          boot.innerHTML = '<strong>Braise n’a pas pu démarrer.</strong><pre></pre>' +
            '<span>Ouvre la console (F12) et envoie ce message. Vérifie aussi chrome://gpu : WebGL doit être activé.</span>';
          boot.querySelector('pre').textContent = text;
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          fail(t && t.src ? 'Fichier introuvable ou refusé : ' + t.src : String(e.message || e.error));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          fail(String((e.reason && e.reason.message) || e.reason));
        });
        window.__braiseBootFail = fail;
        window.__braiseBootDone = function () { if (boot) boot.remove(); boot = null; };
      })();
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
